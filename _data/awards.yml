# Awards shown on the home page and on /awards/.
# Facts and dates come from the CV; every link was checked in October 2026.
- title: XPRIZE Wildfire, Special Recognition ($100,000)
  org: XPRIZE, Space-Based Wildfire Detection and Intelligence Track
  date: Sep 2026
  image: assets/img/deepfire_xprize_trophy.jpg
  summary: >
    The LSU DeepFire team received the Special Recognition for Operational Deliverable, one of five awarded teams in the
    track among more than 300 teams worldwide, for an operational fire-spread-alert capability.
  links:
    - { label: XPRIZE announcement, url: "https://www.xprize.org/news/xprize-wildfire-awardees" }
    - { label: LSU News, url: "https://www.lsu.edu/mediacenter/news/2026/09/23_deepfire_award.php" }
    - { label: Demo video, url: "https://www.youtube.com/watch?v=1zZtAG34TkA" }

- title: ENNS Best Paper Award, ICANN 2025
  org: European Neural Network Society, 34th International Conference on Artificial Neural Networks
  date: Sep 2025
  image: assets/img/award_icann_best_paper.jpg
  summary: >
    Awarded for XOOD, a self-supervised algorithm for detecting out-of-distribution data in image classification,
    contributing toward trustworthy AI in real-world deployments.
  links:
    - { label: Paper, url: "https://doi.org/10.1007/978-3-032-04558-4_42" }
    - { label: Code, url: "https://github.com/MdSaifulIslamSajol/xood-icann/" }

- title: Tiger Team Award, We Build Teams That Win
  org: Louisiana State University
  date: Feb 2026
  image: assets/img/award_tiger_team.jpg
  summary: >
    Recognized for interdisciplinary collaboration and service that advanced the university's mission, particularly
    through contributions to the AI-based wildfire detection and prediction (DeepFire) project.
  links:
    - { label: LSU story, url: "https://www.lsu.edu/blog/2026/02/wbttw-deepfire.php" }

- title: AWS Open Data Sponsorship Program
  org: Amazon Web Services
  date: Jul 2025
  icon: fa-brands fa-aws
  summary: >
    The DeepDrug Protein Embeddings Bank (DPEB) was selected for the program, enabling large-scale public hosting of
    multimodal human protein embeddings.
  links:
    - { label: AWS registry, url: "https://registry.opendata.aws/deepdrug-dpeb/" }

- title: Best Poster Runner-Up Award
  org: SIAM International Conference on Data Mining (SDM)
  date: "2024"
  icon: fa-solid fa-award
  summary: >
    Awarded for COMBOOD, a semiparametric approach for detecting out-of-distribution data for image classification.
  links:
    - { label: Paper, url: "https://doi.org/10.1137/1.9781611978032.74" }
    - { label: arXiv, url: "https://arxiv.org/abs/2602.07042" }
