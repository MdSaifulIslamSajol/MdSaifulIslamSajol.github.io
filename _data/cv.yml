    Experience:
      - company: Louisiana State University, Department of Environmental Sciences
        position: Graduate Research Assistant
        location: Baton Rouge, LA, USA
        start_date: 2022-01-01
        summary: Advisor, Dr. Supratik Mukhopadhyay.
        highlights:
          - "**Computational biology and drug discovery:** active member of the LSU DeepDrug team; build pipelines for protein dataset construction, embedding extraction from pretrained protein models (AlphaFold2, ESM-2, ProtTrans), and protein-protein interaction prediction with graph neural networks (DPEB and KG-DTA papers)."
          - "**Bioinformatics and generative AI:** first author of CARCM (submitted to Artificial Intelligence in Agriculture) and of two manuscripts in preparation, CisGPT (generative design of regulatory DNA) and MOPT (drug design in a chemical embedding space); contributor to the USDA-NIFA funded CRISP-RICE project."
          - "**Computer vision for wildfire detection (DeepFire):** develop computer vision and machine learning models for the LSU DeepFire wildfire detection and prediction system, including smoke detection in visual data, satellite imagery analysis, and spatio-temporal fire spread modeling, and design data fusion pipelines that combine predictive risk maps with real-time environmental signals (Wildfire XPRIZE Special Recognition Awardee)."
          - "**Computer vision and trustworthy AI:** co-developed the out-of-distribution detection methods COMBOOD and XOOD for image classification (Best Paper, ICANN 2025) in collaboration with Intuit, and benchmarked CNN, transformer, and hybrid vision models for medical image classification (brain tumor MRI, skin lesions, chest X-rays)."
          - "**Environmental forecasting:** co-authored a benchmark of deep learning models for daily coastal hypoxia forecasting (IEEE BigData 2025)."
          - "**Mentoring:** help mentor undergraduate students in Dr. Mukhopadhyay's group on AI research projects."

